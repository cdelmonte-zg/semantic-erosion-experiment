# Experiment configuration v4.2
# Phase 1: vary agent, fix model (Claude Sonnet 4.6)
# Phase 2: fix agent (OpenCode), vary model
# 1 run per agent (multiple runs from testlauf kept in results/)

iterations: 10
max_fix_attempts: 3

prompt_sets:
  A: prompts_neutral.txt
  B: prompts_stress.txt

runs:
  # ── Phase 1: Isolate the agent ──
  # All use Claude Sonnet 4.6

  - agent: claude_code
    type: erosion
    prompt_set: A
    runs: 1

  - agent: claude_code
    type: erosion
    prompt_set: B
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: A
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: B
    runs: 1

  - agent: openhands
    type: erosion
    prompt_set: A
    runs: 1

  - agent: openhands
    type: erosion
    prompt_set: B
    runs: 1

  # Control: Claude Code with domain context
  - agent: claude_code
    type: control_a
    prompt_set: A
    runs: 1

  # ── Phase 2: Isolate the model ──
  # All use OpenCode as agent, vary model via MODEL env var

  # Claude Sonnet — reuses Phase 1 opencode results (no extra cost)
  # (opencode A run 1 and opencode B run 1 already cover this)

  # GPT-4o (cloud, ~$5/run)
  - agent: opencode
    type: erosion
    prompt_set: A
    model: gpt-5.4
    phase: 2
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: B
    model: gpt-5.4
    phase: 2
    runs: 1

  # Qwen3-Coder 30B (local, free)
  - agent: opencode
    type: erosion
    prompt_set: A
    model: qwen3-coder
    phase: 2
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: B
    model: qwen3-coder
    phase: 2
    runs: 1

  # Control: OpenCode + GPT-5.4 with domain context (~$7)
  - agent: opencode
    type: control_a
    prompt_set: A
    model: gpt-5.4
    phase: 2
    runs: 1

  # Control: OpenCode + Qwen3 disabled — no erosion to mitigate
  # - agent: opencode
  #   type: control_a
  #   prompt_set: A
  #   model: qwen3-coder
  #   phase: 2
  #   runs: 1
