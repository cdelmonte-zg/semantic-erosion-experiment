# Experiment configuration v4.3
# Phase 1: vary agent, fix model (Claude Sonnet 4.6)
# Phase 2: fix agent (OpenCode), vary model
# Phase 3: Set C (implicit renaming pressure) + Control B (stress + context)
# 1 run per agent

iterations: 10
max_fix_attempts: 3

prompt_sets:
  A: prompts_neutral.txt
  B: prompts_stress.txt
  C: prompts_implicit.txt

runs:
  # ── Phase 1: Isolate the agent (Claude Sonnet 4.6) ──

  - agent: claude_code
    type: erosion
    prompt_set: A
    runs: 1

  - agent: claude_code
    type: erosion
    prompt_set: B
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: A
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: B
    runs: 1

  # Control A: domain context (restrictive) — Set A
  - agent: claude_code
    type: control_a
    prompt_set: A
    runs: 1

  # ── Phase 2: Isolate the model (OpenCode agent) ──

  # Sonnet — reuses Phase 1 opencode results

  - agent: opencode
    type: erosion
    prompt_set: A
    model: gpt-5.4
    phase: 2
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: B
    model: gpt-5.4
    phase: 2
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: A
    model: qwen3-coder
    phase: 2
    runs: 3

  - agent: opencode
    type: erosion
    prompt_set: B
    model: qwen3-coder
    phase: 2
    runs: 3

  # Control A: domain context (restrictive) — Set A
  - agent: opencode
    type: control_a
    prompt_set: A
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: A
    model: gpt-5.4
    phase: 2
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: A
    model: qwen3-coder
    phase: 2
    runs: 1

  # ── Phase 3: Set C (implicit renaming pressure) ──

  - agent: claude_code
    type: erosion
    prompt_set: C
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: C
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: C
    model: gpt-5.4
    phase: 3
    runs: 1

  - agent: opencode
    type: erosion
    prompt_set: C
    model: qwen3-coder
    phase: 3
    runs: 3

  # ── Control B: stress prompts WITH domain context ──
  # Tests if glossary protects under explicit renaming pressure

  - agent: claude_code
    type: control_a
    prompt_set: B
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: B
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: B
    model: gpt-5.4
    phase: 2
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: B
    model: qwen3-coder
    phase: 2
    runs: 1

  # ── Control A permissive: less restrictive domain context ──
  # Tests if a softer context allows refactoring while preventing erosion

  - agent: claude_code
    type: control_a
    prompt_set: B
    context_mode: permissive
    runs: 1

  - agent: opencode
    type: control_a
    prompt_set: B
    model: gpt-5.4
    phase: 2
    context_mode: permissive
    runs: 1
